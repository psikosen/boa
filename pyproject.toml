[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bash-mantis"
version = "0.1.0"
description = "Bash-MANTIS-0.6: Tiny Ternary Instruction-Following Shell Model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.1.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["bash_mantis*"]

[tool.ruff]
line-length = 100
target-version = "py310"
