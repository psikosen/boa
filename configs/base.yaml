# Stage 0: Dense teacher baseline
model:
  vocab_size: 320
  d_model: 108
  n_heads: 4
  n_layers: 4
  ffn_dim: 256
  ctx_len: 256
  dropout: 0.1
  manifold_dim: 12
  workspace_slots: 6
  workspace_slot_dim: 24
  lora_rank: 2
  doc_encoder_dim: 64
  doc_max_len: 128
  lora_target_block: 2
  pref_hidden_dim: 48
  ternary_enabled: false
  precision_island_size: 16

training:
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 0.01
  max_steps: 50000
  warmup_steps: 1000
  grad_clip: 1.0
  seed: 42
  eval_every: 500
  save_every: 2000
  log_every: 50
  device: cuda
  stage: 0
  # Stage 0: only LM loss
  lambda_lm: 1.0
  lambda_off: 0.0
  lambda_text_align: 0.0
  lambda_intent_bridge: 0.0
  lambda_syntax: 0.0
  lambda_exec: 0.0
  lambda_attract: 0.0
  lambda_contract: 0.0
  lambda_equiv: 0.0
  lambda_todo: 0.0

data:
  data_dir: data/processed
  rule_cards_dir: data/rule_cards
  max_seq_len: 256
  raw_bash_ratio: 0.40
  nl2bash_ratio: 0.30
  repair_ratio: 0.15
  explanation_ratio: 0.15

sandbox:
  enabled: false
  temp_dir: /tmp/mantis_sandbox
  timeout_seconds: 5
  max_memory_mb: 64
